# OrbStack 本机部署（本地未提交文件，不要提交）。
#
# - 镜像为本机源码构建，tag 跟随部署的分支与提交：openviking:<分支>-<短 sha>
# - ov.conf 里服务只监听 127.0.0.1:1934，入口脚本把 0.0.0.0:1933 转发过去
# - 发布 1933 到宿主机所有网卡，供内网其他机器访问；回环地址同样可用
# - 复用外部网络 openviking-shared，同网络的 clawith 走 http://openviking:1933/mcp
services:
  openviking:
    image: openviking:gif_android-3e2f2da56
    container_name: openviking
    entrypoint: ["/usr/local/bin/openviking-orbstack-entrypoint"]
    working_dir: /app/.openviking
    ports:
      - "1933:1933"
    volumes:
      - ~/.openviking:/app/.openviking
      - ./docker/openviking-orbstack-entrypoint.sh:/usr/local/bin/openviking-orbstack-entrypoint:ro
      - ./docker/openviking-orbstack-forward.py:/usr/local/bin/openviking-orbstack-forward:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1934/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - openviking-shared

  # OpenAI 兼容 rerank 适配器：OpenViking 的 provider:"vikingdb" 指向的向量库
  # rerank 端点已被火山弃用（400 Rerank is temporarily unavailable in VikingDB），
  # 这里把 OpenAI rerank 协议转成知识库 /api/knowledge/service/rerank，
  # ov.conf 用 rerank.provider="openai" 指过来。凭据在 ~/.openviking/rerank-kb.json（600，不入库）。
  openviking-rerank-adapter:
    image: openviking:gif_android-3e2f2da56
    container_name: openviking-rerank-adapter
    entrypoint: ["python3", "/usr/local/bin/openviking-rerank-adapter"]
    environment:
      KB_RERANK_CREDS: /etc/openviking/rerank-kb.json
    volumes:
      - ./docker/openviking-rerank-adapter.py:/usr/local/bin/openviking-rerank-adapter:ro
      - ~/.openviking/rerank-kb.json:/etc/openviking/rerank-kb.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8808/healthz')\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - openviking-shared

  # 本地 Jev 兼容决策服务：OpenViking 的 rules.jev_rule_matcher 用 provider:"custom"
  # 指到 http://ollaya:11435/v1/systemone（TypeSafe System One 协议）。
  # 模型存 ~/.ollaya，用 `docker exec ollaya ollaya pull decider:0.8b` 拉取。
  # 未设 OLLAYA_API_KEY 时不要改这里的端口绑定成全网卡（同网络/本机进程可直接推理、拉删模型）。
  ollaya:
    image: ghcr.io/ollaya-dev/ollaya:0.18.0
    container_name: ollaya
    command: ["serve"]
    environment:
      # 模型加载后常驻（等价于每次请求带 keep_alive: -1），避免 5 分钟无请求卸载、
      # 下次检索要先等约 5s 冷加载。0.18.0 还没有 OLLAYA_PRELOAD，只能靠首次请求加载。
      OLLAYA_KEEP_ALIVE: "-1"
    ports:
      - "127.0.0.1:11435:11435"
    volumes:
      - ~/.ollaya:/home/ollaya/.ollaya
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - openviking-shared

  # 启动预热：0.18.0 没有 OLLAYA_PRELOAD，模型要等第一次请求才加载（约 5-7s）。
  # 这里在 ollaya 起来后跑一次判断，把模型以 keep_alive -1 装载，OpenViking 的检索就不会撞上冷加载。
  # 跑完即退出（restart: "no"），共享 ollaya 的网络命名空间，CLI 直接连 127.0.0.1:11435。
  ollaya-warmup:
    image: ghcr.io/ollaya-dev/ollaya:0.18.0
    container_name: ollaya-warmup
    depends_on:
      - ollaya
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $(seq 1 60); do
          if ollaya run decider:0.8b --ask warmup --keepalive -1 >/dev/null 2>&1; then
            exit 0
          fi
          sleep 2
        done
        exit 0
    network_mode: "service:ollaya"
    restart: "no"

networks:
  openviking-shared:
    external: true
